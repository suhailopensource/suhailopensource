name: Refresh profile README

on:
  schedule:
    # 00:20 UTC daily -- off the hour, so it isn't queued behind everyone else's cron.
    - cron: "20 0 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update-oss.py"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate merged PRs, issues and activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-oss.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: refresh OSS contributions"
          git push
